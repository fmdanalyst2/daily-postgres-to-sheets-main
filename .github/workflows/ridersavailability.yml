name: Refresh Riders Availability View

on:
  schedule:
    - cron: "40 0 1-15 * *" # 08:25 Nepal time
  workflow_dispatch:

jobs:

  # ── Job 1: Refresh Riders Availability ─────────────────
  DB-lookup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run DB lookup refresh
        run: python riders_availability.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
