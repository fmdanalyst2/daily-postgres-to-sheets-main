name: Refresh Delivery Boy Lookup View

on:
  schedule:
    - cron: "45 2 * * *" # 08:30 Nepal time
  workflow_dispatch:

jobs:

  # ── Job 1: Refresh delivery boy lookup view ─────────────────
  DB-lookup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run DB lookup refresh
        run: python DB_lookup.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}


  # ── Job 2: Refresh vendor lookup view ─────────────────
  update-summary-or-log-sheet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run vendor lookup refresh
        run: python refresh_view_vendor_lookup.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}


  # ── Job 3: Runs after both jobs finish ─────────────────
  notify-or-cleanup:
    runs-on: ubuntu-latest
    needs: [DB-lookup, update-summary-or-log-sheet]

    steps:
      - run: echo "Both database refresh tasks completed successfully!"
