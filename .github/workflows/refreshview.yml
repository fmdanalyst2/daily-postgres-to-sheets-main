name: Daily PostgreSQL to Sheets + Another Task

on:
  schedule:
    - cron: "45 0 1-15 * *"    # 08:45 UTC = 01:30 +0545 Nepal time
  workflow_dispatch:

jobs:

  # ── Job 1: Update main data sheet ────────────────────────────────
  update-main-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary gspread google-auth

      - name: Run main query script
        run: python refresh_view.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}

